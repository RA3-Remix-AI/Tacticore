[package]
name = "tacticore-desktop"
version = "0.1.0"
description = "Tacticore desktop client"
edition = "2021"

[lib]
name = "tacticore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "tacticore-desktop"
version = "0.1.0-beta.1"
description = "Tacticore desktop client"
edition = "2021"

[lib]
name = "tacticore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_System_Com"] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
